<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayDay Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
<style>
  body { font-family: system-ui, sans-serif; background: #f5f7fb; margin: 0; color: #1a2233; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; } .sub { color: #5b6577; margin: 0 0 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  input, button { font: inherit; }
  #prompt { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #c8d0de; border-radius: 8px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #0b3d91; color: #fff; cursor: pointer; margin-top: 12px; }
  button.secondary { background: #e4e9f2; color: #1a2233; margin-left: 8px; }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 12px; margin: 6px 0; } .row b { width: 100px; }
  #d-email { flex: 1; padding: 6px; border: 1px solid #c8d0de; border-radius: 6px; }
  #msg { margin-top: 12px; min-height: 1.2em; } .err { color: #b00020; } .ok { color: #0a7a33; }
  #draft { display: none; }
</style>
</head>
<body>
<main>
  <h1>PayDay Agent</h1>
  <p class="sub">Describe an invoice in plain English. Review it, approve it, and PayPal sends it.</p>

  <div class="card">
    <input id="prompt" placeholder="e.g. Invoice Aman 75 dollars for website design">
    <button id="parse-btn">Draft invoice</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="draft">
    <h3 style="margin-top:0">Review before sending</h3>
    <div class="row"><b>Client</b><span id="d-client"></span></div>
    <div class="row"><b>Email</b><input id="d-email" type="email"></div>
    <div class="row"><b>Item</b><span id="d-desc"></span></div>
    <div class="row"><b>Amount</b><span id="d-amount"></span></div>
    <button id="send-btn">Approve and send</button>
    <button class="secondary" id="cancel-btn">Cancel</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Your invoices</h3>
      <button class="secondary" id="refresh-btn" style="margin:0">Refresh status</button>
    </div>
    <div id="grid" class="ag-theme-quartz" style="margin-top:12px"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let draft = null;

function say(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

const gridApi = agGrid.createGrid($('grid'), {
  columnDefs: [
    { field: 'created', headerName: 'Created' },
    { field: 'client', headerName: 'Client' },
    { field: 'description', headerName: 'Item', flex: 2 },
    { field: 'amount', headerName: 'Amount (USD)', valueFormatter: p => '$' + Number(p.value).toFixed(2) },
    { field: 'status', headerName: 'Status' },
    { field: 'link', headerName: 'Payment link', cellRenderer: p => {
        if (!p.value || !p.value.startsWith('https://www.sandbox.paypal.com/')) return '';
        const a = document.createElement('a');
        a.href = p.value; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open';
        return a;
    } },
  ],
  defaultColDef: { flex: 1, sortable: true, filter: true },
  domLayout: 'autoHeight',
  rowData: [],
});

async function loadInvoices() {
  const r = await fetch('/api/invoices');
  gridApi.setGridOption('rowData', await r.json());
}

$('parse-btn').onclick = async () => {
  const btn = $('parse-btn'); btn.disabled = true; say('Reading your request...');
  try {
    draft = await post('/api/parse', { text: $('prompt').value });
    $('d-client').textContent = draft.client;
    $('d-email').value = draft.email;
    $('d-desc').textContent = draft.description;
    $('d-amount').textContent = '$' + draft.amount.toFixed(2);
    $('draft').style.display = 'block';
    say('Check the details, then approve.', 'ok');
  } catch (e) { say(e.message, 'err'); }
  btn.disabled = false;
};

$('send-btn').onclick = async () => {
  const btn = $('send-btn'); btn.disabled = true; say('Sending via PayPal...');
  try {
    await post('/api/send', { client: draft.client, email: $('d-email').value, description: draft.description, amount: draft.amount });
    $('draft').style.display = 'none'; $('prompt').value = '';
    say('Invoice sent!', 'ok'); loadInvoices();
  } catch (e) { say(e.message, 'err'); }
  btn.disabled = false;
};

$('cancel-btn').onclick = () => { $('draft').style.display = 'none'; say('Cancelled. Nothing was sent.'); };
$('refresh-btn').onclick = loadInvoices;
loadInvoices();
</script>
</body>
</html>
